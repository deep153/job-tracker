<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Globex - Backend Engineer</title>
    <style>
      .resume-upload-oversize, .hidden { display: none; }
      .invisible-resume-upload { opacity: 0; position: absolute; width: 1px; height: 1px; }
    </style>
  </head>
  <body>
    <div class="content-wrapper posting-page">
      <h2>Backend Engineer</h2>
      <form id="application-form" enctype="multipart/form-data" method="POST">
        <div class="section page-centered application-form">
          <h4>Submit your application</h4>
          <ul>
            <li class="application-question resume">
              <label>
                <div class="application-label">Resume/CV <span class="required">✱</span></div>
                <div class="application-field">
                  <a href="#" class="postings-btn template-btn-utility visible-resume-upload">
                    <span class="default-label">ATTACH RESUME/CV</span>
                    <input class="application-file-input invisible-resume-upload" data-qa="input-resume" id="resume-upload-input" name="resume" tabindex="-1" type="file" />
                  </a>
                </div>
              </label>
              <span class="resume-upload-oversize"><p class="error-message">File exceeds the maximum upload size of <b>100MB</b>. Please try a smaller size.</p></span>
            </li>
            <li class="application-question">
              <label>
                <div class="application-label">Full name<span class="required">✱</span></div>
                <div class="application-field"><input type="text" data-qa="name-input" name="name" required /></div>
              </label>
            </li>
            <li class="application-question">
              <label>
                <div class="application-label">Email<span class="required">✱</span></div>
                <div class="application-field"><input name="email" data-qa="email-input" type="email" required /></div>
              </label>
            </li>
            <li class="application-question">
              <label>
                <div class="application-label">Phone </div>
                <div class="application-field"><input type="text" data-qa="phone-input" name="phone" /></div>
              </label>
            </li>
          </ul>
        </div>
        <div class="section page-centered application-form">
          <h4>Links</h4>
          <ul>
            <li class="application-question">
              <label>
                <div class="application-label">LinkedIn URL</div>
                <div class="application-field"><input type="text" name="urls[LinkedIn]" /></div>
              </label>
            </li>
          </ul>
        </div>
        <div class="section page-centered application-form" data-qa="additional-cards">
          <h4 data-qa="card-name">Work Authorization</h4>
          <input type="hidden" value="{}" name="cards[1c719ca9][baseTemplate]" />
          <ul>
            <li class="application-question custom-question">
              <div>
                <div class="application-label full-width multiple-choice"><div class="text">Are you legally authorized to work in the United States?<span class="required">✱</span></div></div>
                <div class="application-field full-width required-field">
                  <ul data-qa="multiple-choice">
                    <li><label><input type="radio" name="cards[1c719ca9][field0]" value="Yes" required="required" /><span class="application-answer-alternative">Yes</span></label></li>
                    <li><label><input type="radio" name="cards[1c719ca9][field0]" value="No" required="required" /><span class="application-answer-alternative">No</span></label></li>
                  </ul>
                </div>
              </div>
            </li>
            <li class="application-question custom-question">
              <div>
                <div class="application-label full-width textarea"><div class="text">Why do you want to work at Globex?<span class="required">✱</span></div></div>
                <div class="application-field full-width required-field">
                  <textarea class="card-field-input" placeholder="Type your response" name="cards[1c719ca9][field1]" required></textarea>
                </div>
              </div>
            </li>
          </ul>
        </div>
        <div class="section page-centered application-form">
          <h4>U.S. Equal Employment Opportunity information</h4>
          <ul>
            <li class="application-question">
              <label>
                <div class="application-label">Gender</div>
                <div class="application-field">
                  <select name="eeo[gender]">
                    <option value="">Select ...</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Decline to self-identify">Decline to self-identify</option>
                  </select>
                </div>
              </label>
            </li>
          </ul>
        </div>
        <div class="section page-centered application-form">
          <label for="additional-information"><h4>Additional information</h4></label>
          <div class="application-additional">
            <textarea placeholder="Add a cover letter or anything else you want to share." name="comments" id="additional-information"></textarea>
          </div>
        </div>
        <input type="hidden" name="accountId" value="b8300af6" />
        <input id="hcaptchaResponseInput" type="hidden" name="h-captcha-response" value="" />
        <button id="hcaptchaSubmitBtn" type="submit" class="hidden"></button>
        <div id="h-captcha" class="h-captcha" data-sitekey="fake-site-key"></div>
        <div class="section page-centered application-form last-section-apply">
          <button id="btn-submit" type="button" class="postings-btn template-btn-submit" data-qa="btn-submit">Submit application</button>
        </div>
      </form>
    </div>
    <script>
      // Like Lever's: the visible button is not a submit button; it runs the (invisible) hCaptcha, then submits.
      document.getElementById("btn-submit").addEventListener("click", () => {
        document.getElementById("hcaptchaSubmitBtn").click();
      });
    </script>
  </body>
</html>
