<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Application for Backend Engineer at Globex</title>
  </head>
  <body>
    <div id="app">
      <h1 class="section-header">Backend Engineer</h1>
      <div class="job__description"><p>Payments in Go.</p></div>
      <form id="application-form" class="application--form" method="post" enctype="multipart/form-data" novalidate>
        <div class="application--questions">
          <div class="text-input-wrapper">
            <label id="first_name-label" for="first_name" class="label">First Name<span class="required">*</span></label>
            <input id="first_name" name="first_name" type="text" aria-required="true" autocomplete="given-name" />
          </div>
          <div class="text-input-wrapper">
            <label id="last_name-label" for="last_name" class="label">Last Name<span class="required">*</span></label>
            <input id="last_name" name="last_name" type="text" aria-required="true" autocomplete="family-name" />
          </div>
          <div class="text-input-wrapper">
            <label id="email-label" for="email" class="label">Email<span class="required">*</span></label>
            <input id="email" name="email" type="text" aria-required="true" autocomplete="email" />
          </div>
          <div class="select">
            <label id="country-label" for="country" class="label select__label">Country<span aria-hidden="true">*</span></label>
            <div class="select__input-container">
              <input class="select__input" id="country" type="text" role="combobox" aria-expanded="false"
                aria-haspopup="true" aria-labelledby="country-label" aria-required="true" value=""
                data-options="U.S. Virgin Islands +1|United Kingdom +44|United States +1" />
            </div>
          </div>
          <div class="text-input-wrapper">
            <label id="phone-label" for="phone" class="label">Phone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" />
          </div>
          <div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload">
            <div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div>
            <div class="secondary-button">
              <button type="button" class="btn btn--rounded">Attach</button>
              <label class="visually-hidden" for="resume">Attach</label>
              <input id="resume" name="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf" />
            </div>
          </div>
          <div role="group" aria-labelledby="upload-label-cover_letter" aria-required="false" class="file-upload">
            <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
            <div class="secondary-button">
              <button type="button" class="btn btn--rounded">Attach</button>
              <label class="visually-hidden" for="cover_letter">Attach</label>
              <input id="cover_letter" name="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx,.txt,.rtf" />
            </div>
          </div>
          <div class="text-input-wrapper">
            <label id="question_4001-label" for="question_4001" class="label">LinkedIn Profile</label>
            <input id="question_4001" name="question_4001" type="text" />
          </div>
          <div class="select">
            <label id="question_4002-label" for="question_4002" class="label">Are you legally authorized to work in the United States?<span class="required">*</span></label>
            <select id="question_4002" name="question_4002" aria-required="true">
              <option value="">Select...</option>
              <option value="1">Yes</option>
              <option value="0">No</option>
            </select>
          </div>
          <div class="select">
            <label id="question_4003-label" for="question_4003" class="label select__label">Will you now or in the future require sponsorship for employment visa status (e.g. H-1B)?<span aria-hidden="true">*</span></label>
            <div class="select__input-container">
              <input class="select__input" id="question_4003" type="text" role="combobox" aria-expanded="false"
                aria-haspopup="true" aria-labelledby="question_4003-label" aria-required="true" value=""
                data-options="Yes|No" />
            </div>
            <input required="" tabindex="-1" aria-hidden="true" class="requiredInput" value="" />
          </div>
          <div class="text-input-wrapper">
            <label id="question_4004-label" for="question_4004" class="label">Why do you want to work at Globex?<span class="required">*</span></label>
            <textarea id="question_4004" name="question_4004" aria-required="true"></textarea>
          </div>
        </div>
        <div id="eeoc_fields" class="eeoc__container">
          <h2>Voluntary Self-Identification</h2>
          <div class="select">
            <label id="gender-label" for="gender" class="label select__label">Gender</label>
            <div class="select__input-container">
              <input class="select__input" id="gender" type="text" role="combobox" aria-expanded="false"
                aria-haspopup="true" aria-labelledby="gender-label" aria-required="false" value=""
                data-options="Male|Female|Decline To Self Identify" />
            </div>
          </div>
          <fieldset class="radio-group">
            <legend id="veteran_status-label" class="label">Veteran Status</legend>
            <label><input type="radio" name="veteran_status" value="1" /> I am not a protected veteran</label>
            <label><input type="radio" name="veteran_status" value="2" /> I identify as one or more of the classifications of protected veteran</label>
            <label><input type="radio" name="veteran_status" value="3" /> I don't wish to answer</label>
          </fieldset>
        </div>
        <input type="hidden" name="fingerprint" value="abc123" />
        <button type="submit" class="btn btn--pill">Submit application</button>
      </form>
    </div>
    <script>
      // Like the React-select dropdowns on Greenhouse forms: the options are only in the page while open, and
      // the chosen one is sent with the form.
      for (const box of document.querySelectorAll("[role=combobox]")) {
        const listId = `react-select-${box.id}-listbox`;
        const chosen = document.createElement("input");
        chosen.type = "hidden";
        chosen.name = box.id;
        box.parentElement.appendChild(chosen);
        const close = () => {
          document.getElementById(listId)?.remove();
          box.setAttribute("aria-expanded", "false");
          box.removeAttribute("aria-controls");
        };
        box.addEventListener("mousedown", () => {
          if (document.getElementById(listId)) return;
          setTimeout(() => {
            const list = document.createElement("div");
            list.id = listId;
            list.setAttribute("role", "listbox");
            for (const text of box.dataset.options.split("|")) {
              const option = document.createElement("div");
              option.setAttribute("role", "option");
              option.textContent = text;
              option.addEventListener("mousedown", (event) => {
                event.preventDefault();
                chosen.value = text;
                box.value = "";
                box.setAttribute("data-chosen", text);
                close();
              });
              list.appendChild(option);
            }
            box.parentElement.appendChild(list);
            box.setAttribute("aria-expanded", "true");
            box.setAttribute("aria-controls", listId);
          }, 50);
        });
        box.addEventListener("keydown", (event) => event.key === "Escape" && close());
        box.addEventListener("blur", close);
      }
    </script>
  </body>
</html>
