    <script>
      // Like Ashby's single-page app: the form renders a moment after the page loads, Yes/No questions are toggle
      // buttons, and submitting sends the answers with fetch and shows the result in place.
      setTimeout(() => {
        const form = document.getElementById("form");
        form.appendChild(document.getElementById("application").content.cloneNode(true));
        for (const button of form.querySelectorAll(".ashby-application-form-input-yesno-option")) {
          button.addEventListener("click", () => {
            const group = button.parentElement;
            for (const other of group.querySelectorAll("button")) other.setAttribute("aria-pressed", String(other === button));
            group.querySelector("input[type=checkbox]").checked = button.dataset.option === "yes";
          });
        }
        form.querySelector(".ashby-application-form-submit-button").addEventListener("click", async () => {
          const sent = new FormData();
          for (const input of form.querySelectorAll(".ashby-application-form-container input, .ashby-application-form-container textarea")) {
            const key = input.name || input.id;
            const yesno = input.closest(".ashby-application-form-input-yesno");
            if (yesno) {
              const pressed = yesno.querySelector("button[aria-pressed=true]");
              if (pressed) sent.append(key, pressed.textContent);
            } else if (input.type === "file") {
              if (input.files.length) sent.append(key, input.files[0]);
            } else if (input.type === "radio") {
              if (input.checked) sent.append(key, input.labels[0].textContent);
            } else if (input.type === "checkbox") {
              if (input.checked) sent.append(key, "on");
            } else {
              sent.append(key, input.value);
            }
          }
          const response = await fetch(location.pathname + location.search, { method: "POST", body: sent });
          const page = new DOMParser().parseFromString(await response.text(), "text/html");
          document.getElementById("root").innerHTML = page.body.innerHTML;
        });
      }, 300);
    </script>
